[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-rag-kit"
version = "0.2.0"
description = "Private, fully local RAG service: hybrid retrieval, cited answers, grounding guardrails and offline evaluation."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nihal Fakhi" }]
requires-python = ">=3.11"
keywords = ["rag", "llm", "ollama", "chromadb", "fastapi", "retrieval", "bm25", "guardrails"]
dependencies = [
    "chromadb>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ragkit = "ragkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # the stopword list reads better as one string

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
